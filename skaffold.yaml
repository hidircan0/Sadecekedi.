apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: sadecekedi
build:
  local:
    push: false
    useDockerCLI: true
    useBuildkit: true
    concurrency: 2
  tagPolicy:
    envTemplate:
      template: "latest"
  hooks:
    after:
      - command: ["bash", "scripts/skaffold-k3s-import.sh"]
        os: [linux]
  artifacts:
    - image: docker.io/library/sadecekedi-backend
      context: .
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "web/**"
            dest: /root
    - image: docker.io/library/sadecekedi-yolo
      context: cat-validator-service
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "*.py"
            dest: /app
manifests:
  rawYaml:
    - k8s/00-namespace.yaml
    - k8s/01-config-secrets.yaml
    - k8s/02-postgres.yaml
    - k8s/03-minio.yaml
    - k8s/04-yolo-fastapi.yaml
    - k8s/05-backend-go.yaml
    - k8s/06-ingress.yaml
    - k8s/07-monitoring.yaml
    - k8s/08-cloudflared.yaml
    - k8s/10-hpa.yaml
    # 09-nvidia-device-plugin.yaml + nvidia-time-slicing.yaml kube-system'de kalır:
    #   kubectl apply -f k8s/nvidia-time-slicing.yaml
    #   kubectl apply -f k8s/09-nvidia-device-plugin.yaml
    #   kubectl rollout restart daemonset/nvidia-device-plugin-daemonset -n kube-system
deploy:
  kubectl:
    defaultNamespace: sadecekedi
  statusCheckDeadlineSeconds: 600
portForward:
  - resourceType: service
    resourceName: go-backend-service
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: kedi-filter-service
    port: 8000
    localPort: 8000
  - resourceType: service
    resourceName: minio-service
    port: 9001
    localPort: 9001
  - resourceType: service
    resourceName: grafana-service
    port: 3000
    localPort: 3000
profiles:
  - name: cpu
    patches:
      - op: replace
        path: /build/artifacts/1/docker/dockerfile
        value: Dockerfile.cpu
      - op: replace
        path: /manifests/rawYaml/4
        value: k8s/04-yolo-fastapi.cpu.yaml
