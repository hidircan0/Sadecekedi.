name: Deploy to Local

on:
  push:
    branches: [ main ] # Sadece main'e push atınca çalışır

jobs:
  deploy:
    runs-on: self-hosted # İşte GitHub'ın görselde istediği değişiklik bu!

    steps:
      - name: Sadecekedi'yi Lokalde Güncelle ve Yeniden Başlat
        run: |
          cd ~/Sadecekedi.
          git fetch --all
          git reset --hard origin/main
          git clean -fd
          docker compose build --no-cache cat-validator backend
          docker compose up -d --force-recreate cat-validator backend
          docker image prune -f