name: CI (Continuous Integration)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — Vet, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test ./... -race -count=1

      - name: Build Go Binary
        run: go build -o /tmp/sadecekedi-backend ./cmd/web

  python:
    name: Python — Lint & Test (YOLO Service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cat-validator-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cat-validator-service/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Syntax Check (Compile Python)
        run: python -m compileall .

      - name: Run Pytest
        run: pytest -v

  docker-build:
    name: Docker — Verify Container Builds
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (Dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sadecekedi-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build YOLO Image (Dry-run)
        uses: docker/build-push-action@v5
        with:
          context: ./cat-validator-service
          file: ./cat-validator-service/Dockerfile.cpu
          push: false
          tags: sadecekedi-yolo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
