all:
  children:
    control:
      hosts:
        local:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # GPU / VPS host. Override at runtime:
    #   -e validator_ssh_host=192.168.1.50 -e validator_ssh_user=hidircan
    validator:
      hosts:
        gpu:
          ansible_host: "{{ validator_ssh_host | default('127.0.0.1') }}"
          ansible_user: "{{ validator_ssh_user | default('hidircan') }}"
          ansible_connection: "{{ validator_ssh_connection | default('local') }}"
