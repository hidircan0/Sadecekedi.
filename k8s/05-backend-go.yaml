apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-backend
  template:
    metadata:
      labels:
        app: go-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
        - name: go-backend
          image: docker.io/library/sadecekedi-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: sadecekedi-secrets
            - configMapRef:
                name: sadecekedi-endpoints
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-backend-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: go-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-worker
  template:
    metadata:
      labels:
        app: upload-worker
    spec:
      initContainers:
        - name: wait-for-services
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z postgres-service 5432 && nc -z kafka-service 9092 && nc -z minio-service 9000; do echo waiting for upload dependencies; sleep 2; done;']
      containers:
        - name: upload-worker
          image: docker.io/library/sadecekedi-worker:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: sadecekedi-secrets
            - configMapRef:
                name: sadecekedi-endpoints
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
