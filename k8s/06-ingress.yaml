apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: request-size-limit
  namespace: sadecekedi
spec:
  buffering:
    maxRequestBodyBytes: 52428800 # 50MB
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sadecekedi-ingress
  namespace: sadecekedi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: sadecekedi-request-size-limit@kubernetescrd
spec:
  rules:
    - host: api.sadecekedi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-backend-service
                port:
                  number: 8080
    - host: minio.sadecekedi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9000
